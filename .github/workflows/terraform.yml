name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8" # keep in sync with the required_version floor in providers.tf (>= 1.5.0)

jobs:
  terraform:
    name: fmt / validate / tflint / checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      # No cloud credentials are configured in CI, so init runs without a
      # backend -- this only downloads providers and checks configuration
      # syntax, it never touches real Azure resources or state.
      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: tflint --recursive

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
